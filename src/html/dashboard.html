<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Painel geral do TechDesk para acompanhamento e listagem de chamados de suporte de TI.">
  <meta name="keywords" content="TechDesk, Dashboard, Painel de Controle, Lista de Chamados, Suporte TI, Gestão de Incidentes">
  <meta name="author" content="Matheus S. Marques">
  <title>TechDesk - Dashboard</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <h1>TechDesk</h1>
      <span id="info-usuario-logado" style="display: block; font-size: 0.8rem; opacity: 0.9;"></span>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
        <li><a href="novo_chamado.html">Abrir Chamado</a></li>
        <li><a href="index.html" id="btn-sair">Sair</a></li>
      </ul>
    </nav>
  </header>

  <main class="app-container">
    <!-- seção de cards com estatísticas gerais -->
    <section class="stats-grid" aria-label="Indicadores de chamados">
      <article class="stat-card">
        <span class="stat-title">Total</span>
        <span class="stat-value">0</span>
      </article>
      <article class="stat-card">
        <span class="stat-title">Abertos</span>
        <span class="stat-value">0</span>
      </article>
      <article class="stat-card">
        <span class="stat-title">Em Atendimento</span>
        <span class="stat-value">0</span>
      </article>
      <article class="stat-card">
        <span class="stat-title">Resolvidos</span>
        <span class="stat-value">0</span>
      </article>
    </section>

    <!-- seção de filtros e busca de chamados -->
    <section class="controls-section">
      <h2 id="titulo-visao-chamados">Visão de Chamados</h2>
      <form class="filter-form" onsubmit="event.preventDefault();">
        <div class="form-group-inline">
          <label for="filtro-visao">Exibir:</label>
          <select id="filtro-visao" name="visao">
            <option value="todos">Todos os Chamados</option>
            <option value="aberto">Somente Abertos</option>
            <option value="em atendimento">Somente Em Atendimento</option>
            <option value="resolvidos">Somente Resolvidos</option>
          </select>
        </div>

        <div class="form-group-inline">
          <label for="busca">Buscar:</label>
          <input type="text" id="busca" name="q" placeholder="Número, título ou solicitante...">
        </div>

        <div class="filter-actions">
          <a href="novo_chamado.html" class="btn btn-secondary">+ Abrir Chamado</a>
        </div>
      </form>
    </section>

    <!-- seção de tabela com chamados recentes -->
    <section class="tickets-section">
      <div class="table-responsive">
        <table class="tickets-table">
          <thead>
            <tr>
              <th>#ID</th>
              <th>Título</th>
              <th id="th-solicitante">Solicitante</th>
              <th>Categoria</th>
              <th>Prioridade</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="main-footer">
    <p>&copy; 2026 TechDesk - Painel Administrativo</p>
  </footer>

  <script type="module" src="../js/dashboard.js"></script>

</body>
</html>
