<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Detalhamento e histórico de atendimento de chamado no TechDesk.">
  <meta name="keywords" content="TechDesk, Detalhes do Chamado, Histórico, Atendimento TI">
  <meta name="author" content="Matheus S. Marques">
  <title>TechDesk - Detalhes do Chamado</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/form.css">
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <h1>TechDesk</h1>
      <span id="info-usuario-logado" style="display: block; font-size: 0.8rem; opacity: 0.9;"></span>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="novo_chamado.html">Abrir Chamado</a></li>
        <li><a href="index.html" id="btn-sair">Sair</a></li>
      </ul>
    </nav>
  </header>

  <main class="app-container">
    <div class="details-layout">
      <!-- coluna principal: detalhes e bate-papo/histórico -->
      <section class="details-main">
        <div class="form-header">
          <h2>Carregando chamado...</h2>
        </div>

        <div class="ticket-description">
          <div class="ticket-info-item">
            <label>Descrição Original do Solicitante:</label>
            <p id="detalhe-descricao"></p>
          </div>
        </div>

        <!-- seção de histórico e interações -->
        <section class="timeline">
          <h3>Histórico e Mensagens do Chamado</h3>
          <div id="lista-interacoes" style="display: flex; flex-direction: column; gap: 1rem;"></div>
        </section>

        <!-- formulário para inserir nova mensagem/parecer -->
        <form action="detalhes_chamado.html" method="POST" class="form-grid" style="margin-top: 2rem;" novalidate>
          <div class="form-group">
            <label for="comentario">Enviar Mensagem / Parecer Técnico:</label>
            <textarea id="comentario" name="comentario" placeholder="Escreva uma dúvida, observação ou parecer técnico..." required></textarea>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Enviar Mensagem</button>
          </div>
        </form>
      </section>

      <!-- coluna lateral: status e informações -->
      <aside class="details-sidebar">
        <div class="ticket-info-item">
          <label>Status Atual:</label>
          <span class="badge-status aberto" style="margin-top: 0.3rem;">Aberto</span>
        </div>

        <div class="ticket-info-item">
          <label>Categoria:</label>
          <span id="detalhe-categoria">—</span>
        </div>

        <div class="ticket-info-item">
          <label>Prioridade:</label>
          <span id="detalhe-prioridade">—</span>
        </div>

        <div class="ticket-info-item">
          <label>Solicitante:</label>
          <span id="detalhe-solicitante">—</span>
        </div>

        <div class="ticket-info-item">
          <label>Data de Abertura:</label>
          <span id="detalhe-data">—</span>
        </div>

        <div id="box-alterar-status" class="form-group" style="margin-top: 1.5rem; display: none;">
          <label for="alterar-status">Alterar Status (Técnico):</label>
          <select id="alterar-status" name="novo_status">
            <option value="Aberto">Aberto</option>
            <option value="Em Atendimento">Em Atendimento</option>
            <option value="Aguardando Usuário">Aguardando Usuário</option>
            <option value="Resolvido">Resolvido</option>
            <option value="Fechado">Fechado</option>
          </select>
        </div>
      </aside>
    </div>
  </main>

  <footer class="main-footer">
    <p>&copy; 2026 TechDesk - Painel Administrativo</p>
  </footer>

  <script type="module" src="../js/detalhes.js"></script>

</body>
</html>
