<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de autenticação do TechDesk - Sistema de Gerenciamento de Chamados de TI.">
  <meta name="keywords" content="TechDesk, Login, Autenticação, Suporte TI, Chamados">
  <meta name="author" content="Matheus S. Marques">
  <title>TechDesk - Autenticação</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-body">

  <div class="login-container">
    <main class="login-card">
      <div class="login-header">
        <h1>TechDesk</h1>
        <p>Acesse sua conta para gerenciar chamados</p>
      </div>

      <form action="dashboard.html" method="GET" class="login-form" novalidate>
        <div class="form-group">
          <label for="email">E-mail corporativo</label>
          <input type="email" id="email" name="email" placeholder="nome@empresa.com" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha de acesso</label>
          <input type="password" id="senha" name="senha" placeholder="••••••••" required>
        </div>

        <div class="login-footer-links">
          <label style="font-weight: normal; font-size: 0.85rem; cursor: pointer;">
            <input type="checkbox" name="lembrar" style="width: auto; margin-right: 0.3rem;"> Lembrar de mim
          </label>
          <a href="#">Esqueceu a senha?</a>
        </div>

        <div class="login-btn-container">
          <button type="submit" class="btn btn-primary">Entrar no Sistema</button>
        </div>
      </form>
    </main>
  </div>
  
  <script src="../js/login.js"></script>

</body>
</html>
