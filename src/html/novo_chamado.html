<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulário para abertura de novos chamados de suporte técnico no TechDesk.">
  <meta name="keywords" content="TechDesk, Novo Chamado, Abrir Ticket, Suporte TI, Solicitante">
  <meta name="author" content="Matheus S. Marques">
  <title>TechDesk - Novo Chamado</title>

  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/form.css">
</head>
<body>
  <header class="main-header">
    <div class="logo">
      <h1>TechDesk</h1>
    </div>
    <nav class="main-nav">
      <ul>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="novo_chamado.html" class="active">Abrir Chamado</a></li>
        <li><a href="index.html">Sair</a></li>
      </ul>
    </nav>
  </header>

  <main class="app-container">
    <section class="form-card">
      <div class="form-header">
        <h2>Abrir Novo Chamado</h2>
        <p>Preencha as informações abaixo para solicitar suporte técnico.</p>
      </div>

      <form action="dashboard.html" method="POST" class="form-grid">
        <div class="form-group">
          <label for="titulo">Título do Problema/Solicitação</label>
          <input type="text" id="titulo" name="titulo" placeholder="Ex: Impressora não responde aos comandos" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria" required>
              <option value="">Selecione...</option>
              <option value="hardware">Hardware</option>
              <option value="software">Software</option>
              <option value="rede">Rede / Internet</option>
              <option value="acesso">Acessos e Permissões</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prioridade">Prioridade Estimada</label>
            <select id="prioridade" name="prioridade" required>
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="descricao">Descrição Detalhada do Incidente</label>
          <textarea id="descricao" name="descricao" placeholder="Descreva com detalhes o que está acontecendo..." required></textarea>
        </div>

        <div class="form-actions">
          <a href="dashboard.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">Enviar Chamado</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="main-footer">
    <p>&copy; 2026 TechDesk - Painel Administrativo</p>
  </footer>
</body>
</html>
