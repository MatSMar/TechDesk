<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tela de autenticação e login no sistema TechDesk. Acesse o painel de suporte de TI.">
  <meta name="keywords" content="TechDesk, Login, Autenticação, Suporte de TI, Chamados, Acesso">
  <meta name="author" content="Matheus S. Marques">
  <title>TechDesk - Autenticação</title>
</head>
<body>
  <header>
    <h1>TechDesk</h1>
    <p>Sistema Web de Gerenciamento de Chamados de TI</p>
  </header>

  <main>
    <section>
      <h2>Acesse sua Conta</h2>
      <form action="dashboard.html" method="GET"> <!-- action e method devem sofrer alterações futuramente, a implementação dessa forma é apenas para navegação entra as páginas  -->
        <p>
          <label for="email">E-mail corporativo:</label><br>
          <input type="email" id="email" name="email" required placeholder="seu.nome@empresa.com">
        </p>
        <p>
          <label for="senha">Senha:</label><br>
          <input type="password" id="senha" name="senha" required>
        </p>
        <p>
          <label for="perfil">Perfil de Acesso:</label><br>
          <select id="perfil" name="perfil" required>
            <option value="funcionario">Funcionário</option>
            <option value="tecnico">Técnico de TI</option>
          </select>
        </p>
        <button type="submit">Entrar no Sistema</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 TechDesk - Todos os direitos reservados.</p>
  </footer>
</body>
</html>
